# Generated by reviewer. Re-run `reviewer init` to change settings.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    name: review
    if: github.event.pull_request.draft == false
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/reviewer
      - name: Run review
        run: python3 .github/reviewer/review.py
        env:
          PROVIDER: "gemini"
          MODEL: "gemini-2.5-flash"
          BASE_URL: ""
          EXTRA_INSTRUCTIONS: ""
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
